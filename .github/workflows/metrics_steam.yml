name: Metrics Steam
on:
  # Schedule daily updates
  schedule: [{cron: "0 * * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run on every push on the master branch
  push: {branches: ["master", "main"]}

# Prevent concurrent runs - wait for previous to complete
concurrency:
  group: metrics-commit
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3
        with:
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          committer_branch: main
          retries: 3
          retries_delay: 30
          retries_output_action: 3
          retries_delay_output_action: 10
          filename: metrics.plugin.steam.svg
          output_action: commit
          base: ""
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561199163893956" # Replace with your Steam ID
          plugin_steam_sections: recently-played
          plugin_steam_recent_games_limit: 1